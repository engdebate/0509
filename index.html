<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期望值互動網頁</title>

<style>
body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background:#f8fafc;
    margin:0;
    padding:30px;
    color:#0f172a;
}

.container {
    max-width:1100px;
    margin:auto;
}

h1 {
    text-align:center;
    font-size:48px;
}

.subtitle {
    text-align:center;
    color:#475569;
}

.stats {
    display:flex;
    justify-content:center;
    gap:20px;
    margin:20px 0 40px;
    flex-wrap:wrap;
}

.stat-card {
    background:white;
    padding:16px 24px;
    border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    text-align:center;
    min-width:180px;
}

.stat-number {
    font-size:32px;
    font-weight:bold;
}

.card {
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-top:25px;
}

button {
    padding:10px 16px;
    border-radius:12px;
    border:1px solid #cbd5e1;
    background:white;
    cursor:pointer;
    margin-right:10px;
}

button:hover {
    background:#e2e8f0;
}

.primary {
    background:#0f172a;
    color:white;
}

.question {
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
}

.feedback {
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    display:none;
}

.correct {
    background:#dcfce7;
    color:#166534;
}

.wrong {
    background:#fee2e2;
    color:#991b1b;
}

select {
    padding:8px;
    border-radius:8px;
}

#score {
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

@media(max-width:700px) {
    h1 {
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>什麼是期望值？</h1>

<p class="subtitle">
期望值是把每個結果依照機率加權後得到的平均值。
</p>

<div class="stats">
    <div class="stat-card">
        <div>👀 瀏覽人數</div>
        <div class="stat-number" id="views">0</div>
    </div>

    <div class="stat-card">
        <div>🏆 滿分人數</div>
        <div class="stat-number" id="perfect">0</div>
    </div>
</div>

<div class="card">
    <h2>核心公式</h2>
    <h3>E(X) = Σ x · P(x)</h3>

    <p>
    每個結果乘上它的機率，再全部加總。
    </p>
</div>

<div class="card">
    <h2>練習題</h2>

    <div class="question">
        <h3>第 1 題</h3>

        <p>
        投一枚公平硬幣，正面得 10 分，反面得 0 分。期望值是多少？
        </p>

        <select id="q1">
            <option value="">請選擇</option>
            <option value="0">0</option>
            <option value="5">5</option>
            <option value="10">10</option>
        </select>

        <div id="fb1" class="feedback"></div>
    </div>

    <div class="question">
        <h3>第 2 題</h3>

        <p>
        公平骰子的期望值是多少？
        </p>

        <select id="q2">
            <option value="">請選擇</option>
            <option value="3">3</option>
            <option value="3.5">3.5</option>
            <option value="6">6</option>
        </select>

        <div id="fb2" class="feedback"></div>
    </div>

    <button class="primary" onclick="checkAnswers()">
        檢查答案
    </button>

    <div id="score"></div>
</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/a/macros/ibsh.tw/s/AKfycbxHblyiTPCOX9zr6wL6rTYQxcSaS3DEaBd_JHWPuT17IgNm7gL12K9PaH9tG-RBtT5IrQ/exec";

async function trackView() {
    try {
        const res = await fetch(SCRIPT_URL + "?event=view");
        const data = await res.json();

        document.getElementById("views").innerText = data.views;
        document.getElementById("perfect").innerText = data.perfectScores;

    } catch(err) {
        console.log(err);
    }
}

async function sendPerfectScore() {
    try {
        const res = await fetch(
            SCRIPT_URL + "?event=perfect_score&score=2"
        );

        const data = await res.json();

        document.getElementById("views").innerText = data.views;
        document.getElementById("perfect").innerText = data.perfectScores;

    } catch(err) {
        console.log(err);
    }
}

function showFeedback(id, correct) {

    const fb = document.getElementById("fb" + id);

    fb.style.display = "block";

    if(correct) {
        fb.className = "feedback correct";
        fb.innerText = "答對了！";
    } else {
        fb.className = "feedback wrong";
        fb.innerText = "再想想看";
    }
}

async function checkAnswers() {

    let score = 0;

    const q1 = document.getElementById("q1").value;
    const q2 = document.getElementById("q2").value;

    const c1 = q1 === "5";
    const c2 = q2 === "3.5";

    if(c1) score++;
    if(c2) score++;

    showFeedback(1, c1);
    showFeedback(2, c2);

    document.getElementById("score").innerText =
        "你的分數：" + score + " / 2";

    if(score === 2) {
        await sendPerfectScore();
    }
}

trackView();

</script>

</body>
</html>
